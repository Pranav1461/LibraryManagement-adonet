<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Categories</h1>
          <p class="page-subtitle">Organize the book catalogue by subject</p>
        </div>
      </div>

      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-4">
          <div class="surface-panel">
            <div class="panel-header">
              <h2 class="panel-title" id="cat-form-title">New Category</h2>
              <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="cat-cancel-btn">Cancel</button>
            </div>
            <div class="panel-body">
              <form id="cat-form" novalidate>
                <div id="cat-form-error" class="alert alert-danger d-none" role="alert"></div>
                <input type="hidden" id="cat-id">
                <div class="mb-3">
                  <label class="form-label" for="cat-name">Category Name *</label>
                  <input type="text" class="form-control" id="cat-name" required maxlength="100">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="cat-desc">Description</label>
                  <textarea class="form-control" id="cat-desc" rows="3" maxlength="500"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 justify-content-center">
                  <i class="bi bi-check-lg"></i> Save Category
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="filter-toolbar">
            <div class="search-input-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="cat-search" placeholder="Search categories...">
            </div>
          </div>
          <div class="table-container">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Category</th>
                    <th>Description</th>
                    <th class="text-end">Books</th>
                    <th>Created</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="cat-tbody">
                  <tr><td colspan="5" class="loading-state">Loading categories...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/categories.js"></script>
</body>
</html>
