<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authors — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Authors</h1>
          <p class="page-subtitle">Manage author profiles and view their published books</p>
        </div>
      </div>

      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-4">
          <div class="surface-panel">
            <div class="panel-header">
              <h2 class="panel-title" id="author-form-title">New Author</h2>
              <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="author-cancel-btn">Cancel</button>
            </div>
            <div class="panel-body">
              <form id="author-form" novalidate>
                <div id="author-form-error" class="alert alert-danger d-none" role="alert"></div>
                <input type="hidden" id="author-id">
                <div class="mb-3">
                  <label class="form-label" for="author-name">Author Name *</label>
                  <input type="text" class="form-control" id="author-name" required maxlength="200">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="author-bio">Biography</label>
                  <textarea class="form-control" id="author-bio" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 justify-content-center">
                  <i class="bi bi-check-lg"></i> Save Author
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="filter-toolbar">
            <div class="search-input-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="author-search" placeholder="Search author name or bio...">
            </div>
          </div>
          <div class="table-container">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Author</th>
                    <th>Biography</th>
                    <th class="text-end">Books</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="authors-tbody">
                  <tr><td colspan="4" class="loading-state">Loading authors...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Author Books Modal -->
  <div class="modal fade" id="authorBooksModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="authorBooksTitle">Books by Author</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="author-books-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/authors.js"></script>
</body>
</html>
