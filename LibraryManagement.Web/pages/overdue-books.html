<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overdue Books — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Overdue Books</h1>
          <p class="page-subtitle">Unreturned loans past their due date and accrued late fines</p>
        </div>
        <a href="return-book.html" class="btn btn-outline-secondary">
          <i class="bi bi-journal-arrow-down"></i> Return Counter
        </a>
      </div>

      <section class="kpi-grid" id="overdue-summary"></section>

      <div class="filter-toolbar">
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="overdue-search" placeholder="Search member, accession #, book title...">
        </div>
      </div>

      <div class="table-container">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Loan #</th>
                <th>Book Title</th>
                <th>Accession #</th>
                <th>Member</th>
                <th>Issued</th>
                <th>Due Date</th>
                <th class="text-end">Overdue Days</th>
                <th class="text-end">Accrued Fine</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="overdue-tbody">
              <tr><td colspan="9" class="loading-state">Loading overdue books...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/overdue-books.js"></script>
</body>
</html>
