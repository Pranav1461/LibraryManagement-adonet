<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publishers — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Publishers</h1>
          <p class="page-subtitle">Manage book publishers and inspect their catalog titles</p>
        </div>
        <button type="button" class="btn btn-primary" id="add-pub-btn">
          <i class="bi bi-plus-lg"></i> Add Publisher
        </button>
      </div>

      <div class="filter-toolbar">
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="pub-search" placeholder="Search publisher name or email...">
        </div>
      </div>

      <div class="table-container">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Publisher</th>
                <th>Contact Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th class="text-end">Books</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="pub-tbody">
              <tr><td colspan="6" class="loading-state">Loading publishers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Publisher Modal -->
  <div class="modal fade" id="pubModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="pubModalTitle">Add Publisher</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="pub-form" novalidate>
          <div class="modal-body">
            <div id="pub-form-error" class="alert alert-danger d-none" role="alert"></div>
            <input type="hidden" id="pub-id">
            <div class="mb-3">
              <label class="form-label" for="pub-name">Publisher Name *</label>
              <input type="text" class="form-control" id="pub-name" required maxlength="200">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="pub-email">Contact Email</label>
                <input type="email" class="form-control" id="pub-email" maxlength="150">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pub-phone">Phone</label>
                <input type="text" class="form-control" id="pub-phone" maxlength="30">
              </div>
            </div>
            <div class="mb-0">
              <label class="form-label" for="pub-address">Address</label>
              <textarea class="form-control" id="pub-address" rows="2" maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Publisher</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Publisher Books Modal -->
  <div class="modal fade" id="pubBooksModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="pubBooksTitle">Books by Publisher</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="pub-books-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/publishers.js"></script>
</body>
</html>
