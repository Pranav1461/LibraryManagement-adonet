<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Copies — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Physical Book Copies</h1>
          <p class="page-subtitle">Track individual accession numbers, shelf locations, and copy statuses</p>
        </div>
        <button type="button" class="btn btn-primary" id="add-copy-btn">
          <i class="bi bi-plus-lg"></i> Add Copy
        </button>
      </div>

      <div class="filter-toolbar">
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="copy-search" placeholder="Search accession #, title, ISBN...">
        </div>
        <select class="form-select w-auto" id="copy-filter-book">
          <option value="">All Books</option>
        </select>
        <select class="form-select w-auto" id="copy-filter-status">
          <option value="">All Statuses</option>
          <option value="Available">Available</option>
          <option value="Borrowed">Borrowed</option>
          <option value="Reserved">Reserved</option>
          <option value="Damaged">Damaged</option>
          <option value="Lost">Lost</option>
          <option value="Inactive">Inactive</option>
        </select>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="copy-reset-btn">Reset</button>
      </div>

      <div class="table-container">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Accession #</th>
                <th>Book Title</th>
                <th>ISBN</th>
                <th>Shelf</th>
                <th>Acquired</th>
                <th>Status</th>
                <th>Notes</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="copies-tbody">
              <tr><td colspan="8" class="loading-state">Loading physical copies...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer" id="copies-pagination"></div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Copy Modal -->
  <div class="modal fade" id="copyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="copyModalTitle">Add Physical Copy</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="copy-form" novalidate>
          <div class="modal-body">
            <div id="copy-form-error" class="alert alert-danger d-none" role="alert"></div>
            <input type="hidden" id="copy-id">
            <div class="mb-3" id="copy-book-group">
              <label class="form-label" for="copy-book">Book Title *</label>
              <select class="form-select" id="copy-book" required></select>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="copy-accession">Accession Number *</label>
                <input type="text" class="form-control" id="copy-accession" required maxlength="50" placeholder="e.g. ACC-046">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="copy-shelf">Shelf Location</label>
                <input type="text" class="form-control" id="copy-shelf" maxlength="50" placeholder="e.g. T-101">
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="copy-status">Copy Status *</label>
                <select class="form-select" id="copy-status" required>
                  <option value="Available">Available</option>
                  <option value="Reserved">Reserved</option>
                  <option value="Damaged">Damaged</option>
                  <option value="Lost">Lost</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="copy-acquired">Acquisition Date</label>
                <input type="date" class="form-control" id="copy-acquired">
              </div>
            </div>
            <div class="mb-0">
              <label class="form-label" for="copy-notes">Notes</label>
              <textarea class="form-control" id="copy-notes" rows="2" maxlength="500"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Copy</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Copy Borrowing History Modal -->
  <div class="modal fade" id="copyHistoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="copyHistoryTitle">Copy Borrowing History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="copy-history-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/book-copies.js"></script>
</body>
</html>
