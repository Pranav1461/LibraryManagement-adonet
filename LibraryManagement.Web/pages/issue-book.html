<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Book — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Issue Book</h1>
          <p class="page-subtitle">Checkout an available physical copy in an atomic SQL transaction</p>
        </div>
      </div>

      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-5">
          <div class="surface-panel">
            <div class="panel-header">
              <h2 class="panel-title">Checkout Form</h2>
              <span class="text-secondary small" id="policy-badge">Loading policy...</span>
            </div>
            <div class="panel-body">
              <form id="issue-form" novalidate>
                <div id="issue-error" class="alert alert-danger d-none" role="alert"></div>
                <div class="mb-3">
                  <label class="form-label" for="issue-member">Member *</label>
                  <select class="form-select" id="issue-member" required></select>
                  <div class="form-text" id="member-eligibility-hint"></div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="issue-copy">Available Physical Copy *</label>
                  <select class="form-select" id="issue-copy" required></select>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label" for="issue-date">Issue Date *</label>
                    <input type="date" class="form-control" id="issue-date" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="issue-duration">Borrowing Days *</label>
                    <input type="number" class="form-control" id="issue-duration" min="1" max="90" value="14" required>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="small text-secondary">Calculated Due Date: <strong id="due-date-preview" class="text-primary"></strong></div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="issue-notes">Notes</label>
                  <input type="text" class="form-control" id="issue-notes" maxlength="500" placeholder="Optional checkout note">
                </div>
                <button type="submit" class="btn btn-primary w-100 justify-content-center" id="submit-issue-btn">
                  <i class="bi bi-journal-arrow-up"></i> Issue Book Copy
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="table-container">
            <div class="panel-header">
              <h2 class="panel-title">Active Checkouts</h2>
              <a href="return-book.html" class="btn btn-outline-secondary btn-sm">Go to Returns</a>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Loan #</th>
                    <th>Accession</th>
                    <th>Book Title</th>
                    <th>Member</th>
                    <th>Due Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="active-loans-tbody">
                  <tr><td colspan="6" class="loading-state">Loading active loans...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/issue-book.js"></script>
</body>
</html>
