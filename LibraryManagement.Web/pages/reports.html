<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — LibraDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <div id="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Reports & Analytics</h1>
          <p class="page-subtitle">Disconnected ADO.NET reports (SqlDataAdapter + DataSet/DataTable) with CSV export</p>
        </div>
        <button type="button" class="btn btn-outline-secondary" id="export-csv-btn">
          <i class="bi bi-download"></i> Export CSV
        </button>
      </div>

      <div class="mb-3">
        <div class="segmented-tabs" id="report-tabs">
          <button type="button" class="segmented-tab active" data-report="books">Book Catalogue</button>
          <button type="button" class="segmented-tab" data-report="available-books">Available Books</button>
          <button type="button" class="segmented-tab" data-report="borrowed-books">Borrowed Books</button>
          <button type="button" class="segmented-tab" data-report="overdue">Overdue Books</button>
          <button type="button" class="segmented-tab" data-report="members">Member History</button>
          <button type="button" class="segmented-tab" data-report="most-borrowed">Most Borrowed</button>
          <button type="button" class="segmented-tab" data-report="categories">Category Report</button>
          <button type="button" class="segmented-tab" data-report="authors">Author Report</button>
          <button type="button" class="segmented-tab" data-report="monthly-borrowing">Monthly Borrowing</button>
          <button type="button" class="segmented-tab" data-report="monthly-returns">Monthly Returns</button>
          <button type="button" class="segmented-tab" data-report="fines">Fine Report</button>
          <button type="button" class="segmented-tab" data-report="copies">Physical Copies</button>
        </div>
      </div>

      <div class="filter-toolbar">
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" id="rep-search" placeholder="Search...">
        </div>
        <select class="form-select w-auto" id="rep-category"><option value="">All Categories</option></select>
        <select class="form-select w-auto" id="rep-author"><option value="">All Authors</option></select>
        <select class="form-select w-auto" id="rep-book"><option value="">All Books</option></select>
        <select class="form-select w-auto" id="rep-member"><option value="">All Members</option></select>
        <select class="form-select w-auto d-none" id="rep-copy-status">
          <option value="">All Copy Statuses</option>
          <option value="Available">Available</option>
          <option value="Borrowed">Borrowed</option>
          <option value="Reserved">Reserved</option>
          <option value="Damaged">Damaged</option>
          <option value="Lost">Lost</option>
          <option value="Inactive">Inactive</option>
        </select>
        <input type="date" class="form-control w-auto" id="rep-start" title="From date">
        <input type="date" class="form-control w-auto" id="rep-end" title="To date">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="rep-reset-btn">Reset</button>
      </div>

      <section class="kpi-grid" id="report-summary-grid"></section>

      <div class="table-container">
        <div class="table-responsive">
          <table class="data-table">
            <thead id="report-thead"></thead>
            <tbody id="report-tbody">
              <tr><td class="loading-state">Loading report...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer" id="report-pagination"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/reports.js"></script>
</body>
</html>
